<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse IR remote codes from the SmartIR community catalog for Home Assistant."
    />
    <title>HA IR Codes Browser</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-row">
        <div>
          <h1 data-i18n="app.title">HA IR Codes Browser</h1>
          <p class="tagline" data-i18n="app.tagline"></p>
          <p class="disclaimer" data-i18n="app.disclaimer"></p>
        </div>
        <div id="lang-slot"></div>
      </div>
    </header>

    <main class="layout layout--single">
      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading" data-i18n="search.title"></h2>

        <div class="compatibility-notice" role="note">
          <strong data-i18n="compat.noticeTitle"></strong>
          <p data-i18n="compat.noticeBody"></p>
        </div>

        <div class="filters">
          <label class="sr-only" for="search-input" data-i18n="search.placeholder"></label>
          <input
            type="search"
            id="search-input"
            class="search-input"
            data-i18n-placeholder="search.placeholder"
            autocomplete="off"
          />
          <select id="type-filter" class="type-filter" aria-label="Type">
            <option value="" data-i18n="search.typeAll"></option>
            <option value="climate" data-i18n="search.typeClimate"></option>
            <option value="fan" data-i18n="search.typeFan"></option>
            <option value="light" data-i18n="search.typeLight"></option>
            <option value="media_player" data-i18n="search.typeMediaPlayer"></option>
          </select>
        </div>

        <p id="search-status" class="status" role="status"></p>
        <p id="results-count" class="results-count"></p>
        <p id="results-empty" class="status" hidden data-i18n="search.noResults"></p>

        <div class="table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th data-i18n="table.manufacturer"></th>
                <th data-i18n="table.models"></th>
                <th data-i18n="table.type"></th>
                <th data-i18n="table.id"></th>
                <th data-i18n="table.view"></th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>

        <div id="compatibility-results" class="compatibility-results" hidden></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <span data-i18n="footer.mit"></span>
        <a href="LICENSE">MIT</a>.
        <span data-i18n="footer.noBackend"></span>
        <a
          href="https://github.com/smartHomeHub/SmartIR"
          rel="noopener noreferrer"
          >smartHomeHub/SmartIR</a
        >
      </p>
    </footer>

    <script type="module" src="js/search.js"></script>
  </body>
</html>
