<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartIR model IR codes detail view." />
    <title>Model detail | HA IR Codes Browser</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-row">
        <div>
          <p class="back-nav">
            <a id="back-link" href="index.html" data-i18n="nav.back"></a>
          </p>
          <h1 id="model-title" class="model-title">…</h1>
        </div>
        <div id="lang-slot"></div>
      </div>
    </header>

    <main class="layout layout--single">
      <p id="model-status" class="status" role="status"></p>

      <div id="model-content" hidden>
        <section class="panel">
          <dl id="model-meta" class="meta-list"></dl>
        </section>

        <section class="panel" aria-labelledby="commands-heading">
          <h2 id="commands-heading" data-i18n="model.commands"></h2>
          <div id="commands-list" class="commands-list"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        <span data-i18n="footer.mit"></span>
        <a href="LICENSE">MIT</a>.
        <span data-i18n="footer.noBackend"></span>
        <a
          href="https://github.com/smartHomeHub/SmartIR"
          rel="noopener noreferrer"
          >smartHomeHub/SmartIR</a
        >
      </p>
    </footer>

    <script type="module" src="js/model.js"></script>
  </body>
</html>
